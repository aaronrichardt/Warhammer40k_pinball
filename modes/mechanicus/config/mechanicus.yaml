#config_version=6

mode:
  start_events: start_mechanicus_mode
  stop_events: carousel_item_selected, carousel_item_canceled
  code: mpf.modes.carousel.code.carousel.Carousel
  use_wait_queue: True
  game_mode: true
  events_when_started: balldevice_bd_scoop_ball_eject_attempt
  events_when_stopped: mode_mechanicus_stopped
mode_settings:
  selectable_items: 
    - khorne
    - nurgle
    - slannesh 
    - tzeench 
    - necrons
    - backInTheFight
  select_item_events: s_start_inactive
  next_item_events: s_right_flipper_active
  previous_item_events: s_left_flipper_active
