#config_version=6

config: 
    - necron_sounds.yaml

mode:
  start_events: carousel_item_selected{item == "necrons"}
  stop_events: timer_necrons_complete
  priority: 200
  

timers:
    necrons: 
        start_value: 60 # seconds
        end_value: 0
        direction: down 
        tick_interval: 1s
        restart_on_complete: false
        start_running: true

widget_player:
    mode_necrons_started: 
        necron_mode_timer:
            action: play
            x: 0
            y: 0
    timer_necrons_complete:
        necrons_mode_timer:
            action: remove
    mode_necrons_stopping:
        necrons_mode_timer:
            action: remove