#config_version=6
##! mode: warp_qualify

mode:
  #this mode starts when the ball starts
  start_events: ball_started
  priority: 200

shots:
  warp_outlane_left:
    switch: s_left_outlane
    profile: inlane_lane_profile
    show_tokens:
      led: l_warp_w
  warp_inlane_left:
    switch: s_left_inlane
    profile: inlane_lane_profile
    show_tokens:
      led: l_warp_a
  warp_inlane_right:
    switch:  s_right_inlane
    profile: inlane_lane_profile
    show_tokens:
      led: l_warp_r
  warp_outlane_right:
    switch:  s_right_outlane
    profile: inlane_lane_profile
    show_tokens:
      led: l_warp_p

  mechanicus_scoop_shot:
    switch: s_scoop
    profile: generic_flash_profile
    start_enabled: false
    show_tokens:
      led: l_adeptus_mechanicius

shot_groups:
  inlane_lane_group:
    shots: warp_inlane_left, warp_inlane_right, warp_outlane_right, warp_outlane_left
    reset_events: inlane_lane_group_hit_complete
    rotate_left_events: s_right_flipper_active
    rotate_right_events: s_left_flipper_active


  start_select_mode_group:
    shots: mechanicus_scoop_shot
    reset_events: 
    enable_events: inlane_lane_group_hit_complete
    disable_events: mechanicus_scoop_shot_hit_complete

shot_profiles:
  inlane_lane_profile:
    states:
      - name: unlit
        show: off
      - name: lit
        show: on
        show_tokens:
          color: purple

  generic_flash_profile:
    states:
      - name: unlit
        show: off
      - name: lit
        show: on
        show_tokens:
          color: yellow


variable_player:
  inlane_lane_group_hit_complete:
    score: 10000
    bonus_multiplier: 1


event_player:
  warp_outlane_left_unlit_hit:
    - warp_w_complete
  warp_inlane_left_unlit_hit:
    - warp_a_complete
  warp_inlane_right_unlit_hit:
    - warp_r_complete
  warp_outlane_right_unlit_hit:
    - warp_p_complete
  
  ball_hold_mystery_scoop_held_ball: start_mechanicus_mode
  mechanicus_scoop_shot_lit_hit: mechanicus_scoop_shot_complete



accruals:
  warp_accrual:
    events:
      - warp_w_complete # index [0]
      - warp_a_complete # index [1]
      - warp_r_complete # index [2]
      - warp_p_complete # index [3]
    reset_on_complete: false
    disable_on_complete: true
    reset_events: mode_warp_qualify_started
    events_when_complete: start_modeselect , reset_warp_lights

  mechanicus_accrual:
    events:
      - mechanicus_scoop_shot_complete # index [0]
    reset_on_complete: false
    disable_on_complete: true
    reset_events: mode_warp_qualify_started
    events_when_complete: start_mechanicus_mode


ball_holds:
  mystery_scoop:
    balls_to_hold: 1
    hold_devices: bd_scoop
    enable_events: start_modeselect
    disable_events: mode_ModeSelect_enable_stopping
    release_one_events: ModeSelect_item_selected
