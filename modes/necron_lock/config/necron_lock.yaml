#config_version=6
mode:
  start_events:  mode_skillshot_stopped, start_necron_lock, disable_necron_lock, enable_necron_lock
  stop_events: stop_necron_lock
  priority: 100


shots:
    necron_lock_drop_target:
        switch: s_droptarget_down
        profile: base_profile
        start_enabled: true
        disable_events: necron_lock_qualified
        enable_events: start_necron_lock
        restart_events: 
        show_tokens:
            led: l_solemnace_arrow
            color: lime 

    necron_lock_back_target:
        switch: s_necron_target
        profile: necron_lock_profile
        start_enabled: false
        disable_events: necron_lock_captured
        enable_events: necron_lock_qualified
        restart_events: necron_lock_qualified
        show_tokens:
            led4: l_necron_lock2
            led3: l_necron_lock1
            led2: l_solemnace_arrow
            led1: l_solemnace_circle
            color: lime

    necron_start_multiball_shot:
        switch: s_droptarget_down
        profile: necron_lock_profile
        start_enabled: false
        enable_events: 
        disable_events: multiball_necron_multiball_started
        restart_events: multiball_lock_necron_lock_full
        show_tokens:
            led4: l_necron_lock2
            led3: l_necron_lock1
            led2: l_solemnace_arrow
            led1: l_solemnace_circle
            color: lime

event_player:
    necron_lock_drop_target_lit_hit{device.counters.necron_lockup.value < 2}:
            - reset_necron_drop

    shot_necron_lock_back_target_hit:
            - necron_lock_captured

    necron_start_multiball_shot_lit_hit:
            - start_necron_multiball

shot_profiles:
   base_profile:
    states:
      - name: lit
        show: generic_flash
        speed: 7
    loop: true

   necron_lock_profile:
    states:
         - name: lit
           show: necron_lock_show
           speed: 7
    loop: true

counters:
  necron_lockup:
    count_events: 
        - necron_lock_drop_target_lit_hit
    starting_count: 0
    count_interval : 1
    direction: up
    count_complete_value: current_player.necron_lock_count #3 then 1+ for each time completed
    disable_on_complete: true
    events_when_complete: necron_lock_qualified


multiball_locks:
  necron_lock: 
    balls_to_lock: 1
    lock_devices: bd_necron_lock
    disable_events: mode_necron_multiball_started
    reset_all_counts_events: multiball_necron_multiball_started
    empty_lock_devices_on_ball_end: true

show_player:
    necron_lock_qualified:
        necron_lock_show:
            action: play
            loops: -1
            show_tokens:
                led1: l_necron_lock1
                led2: l_necron_lock2
                led3: l_solemnace_arrow
                led4: l_solemnace_circle
                color: lime

    necron_lock_captured:
        necron_lock_show:
            action: stop
        necron_rings:
            action: play
            loops: 1

slide_player:
    necron_lock_captured:
        necrons
    s_droptarget_down_active:
        necrons:
            action: remove

sound_player:
    necron_lock_captured:
        Necrons:
            action: play
            volume: 1
            bus: voice
            ducking:
              bus: none
              attack: 0.3 sec
              attenuation: 0
              release_point: 2.0 sec
              release: 1.0 sec
        DP_Cinematic_SFX_Stinger_Charge Up_01:
            action: play
            volume: 1
            bus: effects
            ducking:
             bus: none
             attack: 0.3 sec
             attenuation: 0
             release_point: 2.0 sec
             release: 1.0 sec
