#config_version=6

# TZEENCH - THE CHANGER OF WAYS
# Stage 1: Dramatic strobe effect with roaming shot mechanic
# Stage 2: Batman 66-style progressive ruleset

config:
  - tzeench_sounds.yaml

mode:
  start_events: carousel_item_selected{item == "tzeench"}
  stop_events: timer_tzeench_complete, tzeench_targets_complete
  priority: 200

timers:
  tzeench:
    start_value: 60
    end_value: 0
    direction: down
    tick_interval: 1s
    restart_on_complete: false
    start_running: true

widget_player:
  mode_tzeench_started:
    tzeench_mode_timer:
      action: play
  timer_tzeench_complete:
    tzeench_mode_timer:
      action: remove
  tzeench_targets_complete:
    tzeench_mode_timer:
      action: remove
  mode_tzeench_stopping:
    tzeench_mode_timer:
      action: remove

shot_profiles:
  tzeench_strobe_profile:
    states:
      - name: lit
        show: generic_flash
      - name: hit
        show: tzeench_shot_solid
    loop: false

shots:
  tzeench_center_ramp_shot:
    switch: s_23
    profile: tzeench_strobe_profile
    start_enabled: false
    enable_events: mode_tzeench_started
    disable_events: tzeench_center_ramp_shot_hit
    show_tokens:
      led: l_center_ramp_arrow
      color: teal

  tzeench_left_orbit_shot:
    switch: s_snikt_target
    profile: tzeench_strobe_profile
    start_enabled: false
    enable_events: mode_tzeench_started
    disable_events: tzeench_left_orbit_shot_hit
    show_tokens:
      led: l_left_orbit_arrow
      color: teal

  tzeench_right_orbit_shot:
    switch: s_27
    profile: tzeench_strobe_profile
    start_enabled: false
    enable_events: mode_tzeench_started
    disable_events: tzeench_right_orbit_shot_hit
    show_tokens:
      led: l_right_orbit_arrow
      color: teal

  tzeench_inner_loop_left_shot:
    switch: s_scoop_nurgle_target
    profile: tzeench_strobe_profile
    start_enabled: false
    enable_events: mode_tzeench_started
    disable_events: tzeench_inner_loop_left_shot_hit
    show_tokens:
      led: l_left_innerloop_arrow
      color: teal

  tzeench_inner_loop_right_shot:
    switch: s_24
    profile: tzeench_strobe_profile
    start_enabled: false
    enable_events: mode_tzeench_started
    disable_events: tzeench_inner_loop_right_shot_hit
    show_tokens:
      led: l_right_innerloop_circle
      color: teal

  tzeench_droptarget_shot:
    switch: s_26
    profile: tzeench_strobe_profile
    start_enabled: false
    enable_events: mode_tzeench_started
    disable_events: tzeench_droptarget_shot_hit
    show_tokens:
      led: l_solemnace_arrow
      color: teal

  tzeench_jackpot_shot:
    switch: s_25
    profile: tzeench_strobe_profile
    start_enabled: false
    enable_events: mode_tzeench_started
    disable_events: tzeench_jackpot_shot_hit
    show_tokens:
      led: l_jackpot
      color: teal

counters:
  tzeench_target_counter:
    count_events: tzeench_target_hit
    starting_count: 0
    count_interval: 1
    direction: up
    count_complete_value: 7
    events_when_complete: tzeench_targets_complete
    reset_on_complete: false
    disable_on_complete: true

variable_player:
  mode_tzeench_started:
    tzeench_shots_hit:
      int: 0
      action: set
    tzeench_shot_value:
      int: 100000
      action: set

  tzeench_target_hit:
    score:
      int: current_player.tzeench_shot_value
      block: true
    tzeench_shots_hit:
      action: add
      int: 1
    tzeench_shot_value:
      action: add
      int: 25000

  tzeench_targets_complete:
    score:
      int: 2000000
      block: true

event_player:
  tzeench_center_ramp_shot_hit:
    - tzeench_target_hit
  tzeench_left_orbit_shot_hit:
    - tzeench_target_hit
  tzeench_right_orbit_shot_hit:
    - tzeench_target_hit
  tzeench_inner_loop_left_shot_hit:
    - tzeench_target_hit
  tzeench_inner_loop_right_shot_hit:
    - tzeench_target_hit
  tzeench_droptarget_shot_hit:
    - tzeench_target_hit
  tzeench_jackpot_shot_hit:
    - tzeench_target_hit

show_player:
  mode_tzeench_started:
    tzeench_spotlight_strobe:
      key: tzeench_spotlight_strobe
      loops: -1
      priority: 20
      show_tokens:
        led: spotlight

  mode_tzeench_stopping:
    tzeench_spotlight_strobe:
      action: stop
      key: tzeench_spotlight_strobe

  tzeench_targets_complete:
    tzeench_spotlight_strobe:
      action: stop
      key: tzeench_spotlight_strobe

