sound_player:
  mission_select_tzeench_selected|2s:
    BlueSpinnerThenScoop_01:
      action: play
      volume: 1
      ducking:
        bus: voice
        attack: 0.3 sec
        attenuation: 0
        release_point: 2.0 sec
        release: 1.0 sec

show_player:
  mode_tzeench_started:
    gi_lights_off:
      show_tokens:
        led: GI
    strobe_white:
      show_tokens:
        led: GI
      loops: -1

