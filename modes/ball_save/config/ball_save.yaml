#config_version=6


##! mode: ball_save
mode:
  start_events: ball_started
  stop_events: ball_save_show_ended


ball_saves:
  ball_save_ball_save:
    active_time: 5s
    hurry_up_time: 5s
    timer_start_events: balldevice_bd_plunger_ball_eject_success
    auto_launch: true
    balls_to_save: 1
    early_ball_save_events: s_right_outlane_active, s_ball_save_active, s_left_inlane_active
    
  random_ball_save:
    active_time: 1.5s
    hurry_up_time: 1.5s
    grace_period: .5s
    enable_events: activate 
    auto_launch: true
    balls_to_save: 1   
     
show_player:
  ball_save_ball_save_ball_save_timer_start:
    flash_color:
      key: ball_save
      speed: 2
      show_tokens:
        lights: l_ballsave
        color: yellow
        
  ball_save_ball_save_ball_save_hurry_up:
    flash_color:
      key: ball_save
      speed: 6
      show_tokens:
        lights: l_ballsave
        color: red
        
  ball_save_ball_save_ball_save_disabled:
    ball_save: stop
    
  
  ball_save_random_ball_save_timer_start:
    flash_color:
      key: ball_save
      speed: 2
      show_tokens:
        lights: l_ballsave
        color: purple
        
  ball_random_ball_save_save_hurry_up:
    flash_color:
      key: ball_save
      speed: 6
      show_tokens:
        lights: l_ballsave
        color: red
        
  ball_save_random_ball_save_disabled:
    ball_save: stop
    

        

    
