    reset_events: 
    enable_events: xenos_spotted
    disable_events: mechanicus_scoop_shot_hit_complete
    restart_events: xenos_spotted

shot_profiles: 
  pop_profile:
    states:
      - name: unlit
        show: off
      - name: hit
        show: pop_flash
        speed: 1
    loop: true

  orbit_profile:
    states:
      - name: unlit
        show: off
      - name: lit_solid
        show: solid_color
        show_tokens:
          color: white
      - name: hit
        show: solid_color
        show_tokens:
          color: white
    loop: false

  sequence_combo_profile:
    states:
      - name: lit
        show: generic_flash
        speed: 5
      - name: hit
        show: solid_color
        show_tokens:
          color: white
    loop: false

  sequence_stage_profile: 
    states: 
      - name: lit
        show: generic_flash
      - name: hit
        show: solid_color
   
    

  generic_flash_profile:
    states:
      - name: lit
        show: generic_flash
      - name: unlit
        show: off

  base_combo_profile:
    states:
      - name: unlit
        show: off
      - name: enabled
        show: generic_flash
        speed: 5
        loops: -1
      - name: lit
        show: solid
        speed: 1
        loops: -1

timers: 
