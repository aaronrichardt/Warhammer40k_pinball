shots: 
  left_orbit:
    switch: s_left_ramp
  right_orbit:
    switch: s_right_orbit
    profile: orbit_profile
  left_slingshot:
    switch: s_left_slingshot
  right_slingshot:
    switch: s_right_slingshot
  pop_top:
    switch: s_pop_top
    profile: pop_profile
  pop_bottom:
    switch: s_pop_bottom
    profile: pop_profile
  left_drain:
    switch: s_left_outlane
  right_drain:
    switch: s_right_outlane
  base_innerloop_right:
    switch: s_innerloop_right
    profile: sequence_combo_profile
    start_enabled: false
  base_jackpot_vuk:
    switch: s_jackpot_vuk
    profile: sequence_combo_profile
    start_enabled: false
  
  #COMBO RIGHT ORBIT START
  starting_combo_right_orbit:
    switch: s_right_orbit
    profile: sequence_stage_profile
    start_enabled: true 
    restart_events: 
    disable_events: #Disable duing Multiballs or Modes 
    show_tokens:
        led: l_right_orbit_arrow
        color: white 
    
  second_combo_stage_jackpot:
    switch: s_jackpot_vuk
    profile:  sequence_stage_profile
    start_enabled: false
    restart_events: starting_combo_right_orbit_hit
    disable_events: #Disable duing Multiballs or Modes 
    show_tokens:
        led: l_jackpot
        color: white 

  second_combo_stage_right_inner_loop:
    hit_events: base_innerloop_right
    profile: sequence_stage_profile
    start_enabled: false
    restart_events: starting_combo_right_orbit_hit
    disable_events: disable_base_combos
    show_tokens:
        led: l_innerloop_arrow
        color: white
    #Disable duing Multiballs or Modes 

   #COMBO RIGHT ORBIT END


  #COMBO LEFT ORBIT START
  starting_combo_left_orbit:
    switch: s_left_orbit
    profile: sequence_stage_profile
    start_enabled: true 
    restart_events: 
    disable_events: #Disable duing Multiballs or Modes 
    show_tokens:
        led: l_left_orbit_arrow
        color: white 
    
  second_combo_stage_center_ramp:
    switch: s_center_ramp
    profile:  sequence_stage_profile
    start_enabled: false 
    restart_events: starting_combo_left_orbit_hit
    disable_events: #Disable duing Multiballs or Modes 
    show_tokens:
        led: l_center_ramp_arrow
        color: white

  second_combo_stage_left_loop:
    hit_events: base_innerloop_left
    profile: sequence_stage_profile
    start_enabled: false
    restart_events: starting_combo_right_orbit_hit
    disable_events: #Disable duing Multiballs or Modes 
    show_tokens:
        led: l_left_innerloop_arrow
        color: white
   #COMBO LEFT ORBIT END

  #COMBO CENTER RAMP START
  starting_combo_center_ramp:
    switch: s_center_ramp
    profile: sequence_stage_profile
    start_enabled: true 
    restart_events: 
    disable_events: #Disable duing Multiballs or Modes 
    show_tokens:
        led: l_left_orbit_arrow
        color: white 
    
  second_combo_stage_right_orbit:
    switch: s_right_orbit
    profile:  sequence_stage_profile
    start_enabled: false 
    restart_events: starting_combo_center_ramp_hit
    disable_events: #Disable duing Multiballs or Modes 
    show_tokens:
        led: l_center_ramp_arrow
        color: white

  second_combo_stage_scoop:
    switch: s_scoop
    profile: sequence_stage_profile
    start_enabled: false
    restart_events: starting_combo_center_ramp_hit
    disable_events: #Disable duing Multiballs or Modes 
    show_tokens:
        led: l_light_mystery
        color: white
   #COMBO CENTER RAMP END

  mechanicus_scoop_shot:
    switch: s_scoop
    profile: generic_flash_profile
    show_tokens:
        led: l_adeptus_mechanicius
        color: lime 
    start_enabled: false
    enable_events: xenos_spotted
    

shot_groups:
  right_orbit_combo:
    shots: right_orbit, base_innerloop_right, base_jackpot_vuk
    reset_events: ball_started
    enable_events: ball_started
    disable_events: #Disable duing Multiballs or Modes 
    restart_events: right_orbit_hit

  start_select_mode_group:
    shots: mechanicus_scoop_shot
    reset_events: 
    enable_events: xenos_spotted
    disable_events: mechanicus_scoop_shot_hit_complete
    restart_events: xenos_spotted

shot_profiles: 
  pop_profile:
    states:
      - name: unlit
        show: off
      - name: hit
        show: pop_flash
        speed: 1
    loop: true

  orbit_profile:
    states:
      - name: unlit
        show: off
      - name: lit_solid
        show: solid_color
        show_tokens:
          color: white
      - name: hit
        show: solid_color
        show_tokens:
          color: white
    loop: false

  sequence_combo_profile:
    states:
      - name: unlit
        show: off
      - name: lit
        show: generic_flash
      - name: hit
        show: solid_color
        show_tokens:
          color: white
    loop: false

  sequence_stage_profile: 
    states: 
      - name: lit
        show: generics_flash
      - name: hit
        show: solid_color



  generic_flash_profile:
    states:
      - name: lit
        show: generic_flash
      - name: unlit
        show: off

  base_combo_profile:
    states:
      - name: unlit
        show: off
      - name: enabled
        show: generic_flash
        speed: 5
        loops: -1
      - name: lit
        show: solid
        speed: 1
        loops: -1

timers: 
    base_combo_right_orbit:
        start_value: 3
        end_value: 0
        direction: down
        tick_interval: 1s
        control_events:
         - event: right_orbit_hit
           action: start
            
            
            
 
accruals:
    all_missions_complete:
        events:
            - award_nurgle_mission_complete
            - award_khorne_mission_complete
            - award_slannesh_mission_complete
            - award_tyranids_mission_complete
            - award_tzeench_mission_complete
            - award_necron_mission_complete
            
counters:
  blood_angels_qualify_counter:
    count_events: left_orbit_hit
    starting_count: 0
    count_interval: 1
    direction: up
    count_complete_value: current_player.blood_angels_qualify_value
    events_when_complete: blood_angels_qualified
    reset_on_complete: false
    disable_on_complete: true

  imperial_fists_qualify_counter:
    count_events: left_orbit_hit
    starting_count: 0
    count_interval: 1
    direction: up
    count_complete_value: current_player.imperial_fists_qualify_value
    events_when_complete: imperial_fists_qualified
    reset_on_complete: false
    disable_on_complete: true
  salamanders_qualify_counter:
    count_events: right_orbit_hit
    starting_count: 0
    count_interval: 1
    direction: up
    count_complete_value: current_player.salamanders_qualify_value
    events_when_complete: salamanders_qualified
    reset_on_complete: false
    disable_on_complete: true
  dark_angels_qualify_counter:
    count_events: right_orbit_hit
    starting_count: 0
    count_interval: 1
    direction: up
    count_complete_value: current_player.dark_angels_qualify_value
    events_when_complete: dark_angels_qualified
    reset_on_complete: false
    disable_on_complete: true
  
  warp_qualify_counter:
    count_events: s_snikt_active
    starting_count: 0
    count_interval: 1
    direction: up
    count_complete_value: 3 + (current_player.pv_warp_mode_counter * 2)
    events_when_complete: start_mode_warp
    reset_on_complete: true
    disable_on_complete: false
  necron_lock_qualifier:
    count_events: s_droptarget_down_active
    starting_count: 0
    count_interval : 1
    direction: up
    count_complete_value: 1
    events_when_complete: 
        - reset_necron_drop 
    disable_on_complete: true
  necron_lock_qualifier2:
    count_events: s_droptarget_down_active
    starting_count: 0
    count_interval : 1
    direction: up
    count_complete_value: 2
    events_when_complete: 
        - reset_necron_drop 
    disable_on_complete: true
  necron_lock_qualifier3:
    count_events: s_droptarget_down_active
    starting_count: 0
    count_interval : 1
    direction: up
    count_complete_value: 3
    events_when_complete: start_necron_lock
    reset_on_complete: true
    disable_on_complete: true

