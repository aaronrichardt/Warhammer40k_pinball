shot_groups:
  right_orbit_combo:
    shots: base_shot_right_orbit, base_shot_innerloop_right, base_shot_jackpot_vuk
    reset_events: timer_base_combo_right_orbit_completed, ball_started, right_orbit_combo_hit_complete
    enable_events: 
        - ball_started
        - mode_knorne_stopped
        - mode_nurgle_stopped
        - mode_slannesh_stopped
        - mode_necrons_stopped
        - mode_tzeench_stopped
    disable_events: 
        - mode_knorne_started
        - mode_nurgle_started
        - mode_slannesh_started
        - mode_necrons_started
        - mode_tzeench_started

  left_orbit_combo:
    shots: base_shot_left_orbit, base_shot_innerloop_left, base_shot_center_ramp
    reset_events: timer_base_combo_left_orbit_completed, ball_started, left_orbit_combo_hit_complete
    enable_events: 
        - ball_started
        - mode_knorne_stopped
        - mode_nurgle_stopped
        - mode_slannesh_stopped
        - mode_necrons_stopped
        - mode_tzeench_stopped
    disable_events: 
        - mode_knorne_started
        - mode_nurgle_started
        - mode_slannesh_started
        - mode_necrons_started
        - mode_tzeench_started

  start_select_mode_group:
