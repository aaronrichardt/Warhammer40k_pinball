counters:
  dreadnought_lock_counter:
    count_events: base_dreadnought_lock_lit_hit
    starting_count: 0
    count_interval: 1
    direction: up
    count_complete_value: 3
    events_when_complete: base_dreadnought_lock_qualified
    reset_on_complete: true
    disable_on_complete: false

  blood_angels_qualify_counter:
    count_events: left_orbit_hit
    starting_count: 0
    count_interval: 1
    direction: up
    count_complete_value: current_player.blood_angels_qualify_value
    events_when_complete: blood_angels_qualified
    reset_on_complete: false
    disable_on_complete: true

  imperial_fists_qualify_counter:
    count_events: left_orbit_hit
    starting_count: 0
    count_interval: 1
    direction: up
    count_complete_value: current_player.imperial_fists_qualify_value
    events_when_complete: imperial_fists_qualified
    reset_on_complete: false
    disable_on_complete: true
  salamanders_qualify_counter:
    count_events: right_orbit_hit
    starting_count: 0
    count_interval: 1
    direction: up
    count_complete_value: current_player.salamanders_qualify_value
    events_when_complete: salamanders_qualified
    reset_on_complete: false
    disable_on_complete: true
  dark_angels_qualify_counter:
    count_events: right_orbit_hit
    starting_count: 0
    count_interval: 1
    direction: up
    count_complete_value: current_player.dark_angels_qualify_value
    events_when_complete: dark_angels_qualified
    reset_on_complete: false
    disable_on_complete: true
  
  warp_qualify_counter:
    count_events: s_snikt_active
    starting_count: 0
    count_interval: 1
    direction: up
    count_complete_value: 3 + (current_player.pv_warp_mode_counter * 2)
    events_when_complete: start_mode_warp
    reset_on_complete: true
    disable_on_complete: false

