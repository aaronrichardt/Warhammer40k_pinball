#config_version=6
mode: 
   start_events: ball_starting
   stop_events: ball_will_end, mode_super_jets_starting, multiball_start
   priority: 300

counters:
   super_jets_qualifier:
    enable_events: mode_base_started{current_player.sj_active == 0}
    count_events: jets_hit
    starting_count: 0
    count_complete_value: 50
    count_interval: 1
    events_when_complete: enable_super_jets
    persist_state: true


   super_jets_resume:
    enable_events: mode_base_started{current_player.sj_active == 1 }
    count_events: jets_hit
    starting_count: 0
    count_complete_value: 25
    count_interval: 1
    direction: up
    persist_state: false
    events_when_complete: re-enable_super_jets
    reset_on_complete: true

   lb_rollover_complete_count:
    count_events: rollover_lanes_complete
    events_when_hit: rollover_lanes_done
    starting_count: 0
    count_complete_value: 40
    reset_on_complete: false
    direction: up
    persist_state: false



shots:
    jets:
        switch: s_jet_bottom, s_jet_top

variable_player:
   
    s_jet_bottom_active:
        score: 10000 + (device.counters.lb_rollover_complete_count.value * 10000)
    s_jet_top_active:
        score: 10000 + (device.counters.lb_rollover_complete_count.value * 10000)

widget_player:
    mode_super_jets_qualifier_started:
        super_jets_qualifier:
            action: play
            x: 38.25
            y: 10.5
            slide: base
            priority: 300
    mode_super_jets_qualifier_stopping:
        super_jets_qualifier:
            action: remove
    enable_super_jets:
        super_jets_qualifier:
            action: remove
        