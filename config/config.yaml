servos:
    ork_servo:
        platform_settings:
            min_us: 0
            home_us: 2400
            max_us: 2500
            max_runtime: 5s
        positions:
            0.6: ork_home
            0.4: ork_left
            0.7: ork_right
        number: playfield2-1


autofire_coils:
  ac_slingshot_left:
    coil: c_left_slingshot
    switch: s_left_slingshot
  ac_slingshot_right:
    coil: c_right_slingshot
    switch: s_right_slingshot
  ac_popbumper_top:
    coil: c_pop_top
    switch: s_pop_top
  ac_popbumper_bottom:
    coil: c_pop_bottom
    switch: s_pop_bottom


spinners:
  center_spinner:
    switch: s_center_spinner
    active_ms: 100
  left_spinner:
    switch: s_left_spinner
    active_ms: 100
  right_spinner:
    switch: s_right_spinner
    active_ms: 100


