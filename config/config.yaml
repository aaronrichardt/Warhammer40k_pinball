#config_version=6
# This config is only valid for MPF 0.56.1

hardware:
    platform: fast 

fast:
  net:
    controller: neuron
    io_loop: 
            3208:
                model: FP-I/O-3208
                order: 3
            32082:
                model: FP-I/O-3208
                order: 1
            io0804:
                model: FP-I/O-0804
                order: 2
    baud: 921600
    debug: false
    console_log: none
    file_log: basic
    watchdog: 1s
    default_quick_debounce_open: 1ms
    default_quick_debounce_close: 1ms
    default_normal_debounce_open: 4ms
    default_normal_debounce_close: 4ms
  aud:
    optional: true
    headphones_amp_enabled: true
    link_main_to_main: false
    link_sub_to_main: false

  exp:
    #port: com5
    boards: 
      playfield:
        model: FP-EXP-0081
      playfield2:        
        model: FP-EXP-0071
      neuron:
        model: FP-EXP-2000

game: 
  balls_per_game: 3
 
machine: 
  balls_installed: 6
  min_balls: 3
  
config: 
  - lights.yaml
  - coils.yaml
  - flippers.yaml
  - switches.yaml
  - videos.yaml
  - timed_switches.yaml
  - player_variables.yaml
  - modes.yaml
  - drop_targets.yaml

displays:
  window:
    width: 1920
    height: 1080
    default: true
    fullscreen: true

window:
  height: 1080
  width: 1920
  title: Mission Pinball Framework
  resizable: true
  fullscreen: true
  borderless: true
  exit_on_escape: true
  source_display: window

playfields:
  playfield:
    default_source_device: bd_plunger
    tags: default

ball_devices:
    bd_plunger:
      mechanical_eject: True
      ball_switches: s_autoplunger
      eject_coil: c_autoplunger
      eject_timeouts: 5s
      eject_targets: playfield
    bd_trough:
      ball_switches: s_trough1, s_trough2, s_trough3, s_trough4, s_trough5, s_trough6, s_trough_jam
      eject_coil: c_trough_eject
      tags: trough, home, drain
      jam_switch: s_trough_jam
      eject_coil_jam_pulse: 15ms
      eject_targets: bd_plunger
      eject_timeouts: 3s

    bd_scoop:
      ball_switches: s_scoop
      eject_coil: c_scoop
      auto_fire_on_unexpected_ball: false

    bd_titan:
        ball_switches: s_titan_lock1, s_titan_lock2, s_titan_lock3
        eject_coil: c_titan_lock
        eject_timeouts: 3s
        eject_coil_enable_time: 3s

    bd_right_vuk:
        ball_switches: s_jackpot_vuk
        eject_coil: c_jackpot_vuk
        eject_timeouts: 3s
    #bd_necron_lock:
    #  mechanical_eject: Trues
    #  ball_switches: s_droptarget_opto    

    #d_droppod:
    # mechanical_eject: false
    # ball_switches: s_lockopto1, s_lockopto3
    # eject_coil: c_droppod
    # eject_timeouts: 3s
      

